<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Obsidify</title>
  <desc id="d">A PDF script dissolving into a linked knowledge graph, next to the OBSIDIFY wordmark.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0910"/>
      <stop offset="0.55" stop-color="#120E1E"/>
      <stop offset="1" stop-color="#0D0A16"/>
    </linearGradient>

    <radialGradient id="halo" cx="480" cy="160" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CE6" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#6D4AE0" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#6D4AE0" stop-opacity="0"/>
    </radialGradient>

    <!-- paper -> violet, mapped across the transformation zone -->
    <linearGradient id="dissolve" x1="230" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EFECF6"/>
      <stop offset="0.45" stop-color="#C9BCF7"/>
      <stop offset="1" stop-color="#8F6FF0"/>
    </linearGradient>

    <linearGradient id="paper" x1="80" y1="76" x2="232" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FAF8FD"/>
      <stop offset="1" stop-color="#DCD5EC"/>
    </linearGradient>

    <radialGradient id="node" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#D6C8FF"/>
      <stop offset="1" stop-color="#6D4AE0"/>
    </radialGradient>

    <radialGradient id="hubglow" cx="480" cy="160" r="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="word" x1="650" y1="120" x2="1130" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#EDE7FE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1200" height="320" rx="26" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="320" rx="26" fill="url(#halo)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="25.25" fill="none" stroke="#A78BFA" stroke-opacity="0.16"/>

  <!-- ── the script ── -->
  <g>
    <path d="M88 76 H204 L232 104 V236 A8 8 0 0 1 224 244 H88 A8 8 0 0 1 80 236 V84 A8 8 0 0 1 88 76 Z" fill="url(#paper)"/>
    <path d="M204 76 L232 104 H212 A8 8 0 0 1 204 96 Z" fill="#B9AED2"/>

    <rect x="96" y="98" width="72" height="10" rx="5" fill="#6D4AE0" fill-opacity="0.55"/>
    <g fill="#A79DBE" fill-opacity="0.75">
      <rect x="96" y="124" width="106" height="7" rx="3.5"/>
      <rect x="96" y="140" width="118" height="7" rx="3.5"/>
      <rect x="96" y="156" width="86"  height="7" rx="3.5"/>
      <rect x="96" y="172" width="112" height="7" rx="3.5"/>
      <rect x="96" y="188" width="70"  height="7" rx="3.5"/>
    </g>
    <rect x="96" y="212" width="44" height="19" rx="5" fill="#E0655E"/>
    <text x="118" y="226" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.6" text-anchor="middle" fill="#FFFFFF">PDF</text>
  </g>

  <!-- ── flow lines ── -->
  <g fill="none" stroke="url(#dissolve)" stroke-opacity="0.4" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="1 8">
    <path d="M234 132 C300 128, 380 134, 468 152"/>
    <path d="M234 196 C300 200, 386 192, 470 172"/>
  </g>

  <!-- ── dissolving fragments ── -->
  <g fill="url(#dissolve)">
    <rect x="240" y="116" width="9"  height="9"  rx="2" transform="rotate(-14 244.5 120.5)" opacity="0.95"/>
    <rect x="246" y="176" width="8"  height="8"  rx="2" transform="rotate(10 250 180)"      opacity="0.9"/>
    <rect x="256" y="146" width="7"  height="7"  rx="2" transform="rotate(-8 259.5 149.5)"  opacity="0.85"/>
    <rect x="268" y="108" width="8"  height="8"  rx="2" transform="rotate(18 272 112)"      opacity="0.9"/>
    <rect x="276" y="200" width="7"  height="7"  rx="2" transform="rotate(-16 279.5 203.5)" opacity="0.8"/>
    <rect x="290" y="160" width="6"  height="6"  rx="1.8" transform="rotate(12 293 163)"    opacity="0.85"/>
    <rect x="300" y="126" width="7"  height="7"  rx="2" transform="rotate(-20 303.5 129.5)" opacity="0.8"/>
    <rect x="308" y="216" width="6"  height="6"  rx="1.8" transform="rotate(8 311 219)"     opacity="0.7"/>
    <rect x="322" y="182" width="6"  height="6"  rx="1.8" transform="rotate(-10 325 185)"   opacity="0.8"/>
    <rect x="332" y="140" width="5"  height="5"  rx="1.5" transform="rotate(16 334.5 142.5)" opacity="0.75"/>
    <rect x="346" y="198" width="5"  height="5"  rx="1.5" transform="rotate(-12 348.5 200.5)" opacity="0.7"/>
    <rect x="352" y="118" width="5"  height="5"  rx="1.5" transform="rotate(20 354.5 120.5)" opacity="0.65"/>
    <rect x="362" y="164" width="4"  height="4"  rx="1.2" transform="rotate(-6 364 166)"    opacity="0.7"/>
    <rect x="372" y="210" width="4"  height="4"  rx="1.2" transform="rotate(14 374 212)"    opacity="0.6"/>
  </g>

  <!-- ── knowledge graph ── -->
  <g>
    <g stroke="#8F6FF0" stroke-width="1.6" stroke-linecap="round" fill="none">
      <path d="M480 160 L432 106" stroke-opacity="0.6"/>
      <path d="M480 160 L400 192" stroke-opacity="0.5"/>
      <path d="M480 160 L546 102" stroke-opacity="0.62"/>
      <path d="M480 160 L560 214" stroke-opacity="0.5"/>
      <path d="M480 160 L492 246" stroke-opacity="0.45"/>
      <path d="M432 106 L546 102" stroke-opacity="0.28"/>
      <path d="M546 102 L584 156" stroke-opacity="0.34"/>
      <path d="M584 156 L560 214" stroke-opacity="0.3"/>
      <path d="M400 192 L492 246" stroke-opacity="0.24"/>
      <path d="M432 106 L400 192" stroke-opacity="0.26"/>
    </g>

    <circle cx="480" cy="160" r="52" fill="url(#hubglow)"/>
    <circle cx="480" cy="160" r="27" fill="none" stroke="#A78BFA" stroke-opacity="0.3" stroke-width="1.2"/>

    <g stroke="#D6C8FF" stroke-opacity="0.45" stroke-width="1.2">
      <circle cx="480" cy="160" r="17" fill="url(#node)"/>
      <circle cx="432" cy="106" r="9"  fill="url(#node)"/>
      <circle cx="400" cy="192" r="7"  fill="url(#node)"/>
      <circle cx="546" cy="102" r="11" fill="url(#node)"/>
      <circle cx="560" cy="214" r="8"  fill="url(#node)"/>
      <circle cx="492" cy="246" r="6"  fill="url(#node)"/>
      <circle cx="584" cy="156" r="5"  fill="url(#node)"/>
    </g>
  </g>

  <!-- ── divider ── -->
  <line x1="618" y1="92" x2="618" y2="228" stroke="#A78BFA" stroke-opacity="0.22" stroke-width="1.2"/>

  <!-- ── wordmark ── -->
  <text x="906" y="176" text-anchor="middle" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="76" font-weight="800" letter-spacing="4" fill="url(#word)">OBSIDIFY</text>
  <text x="908" y="212" text-anchor="middle" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="600" letter-spacing="3.6" fill="#A78BFA" fill-opacity="0.82">SCRIPT &#8594; LINKED OBSIDIAN VAULT</text>
</svg>
